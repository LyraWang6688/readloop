# ReadLoop 后端服务
#
# 单副本！创建会话存在进程内存里（见 docs/API_IMPLEMENTATION.md），不要 scale 多副本。
services:
  readloop:
    build:
      context: .
    image: readloop-service:latest
    container_name: readloop-service
    restart: unless-stopped
    # 生产密钥放 /opt/readloop/.env：LICENSE_SECRET / QUESTION_ID_SECRET / PORT
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/work/logs/bypass
